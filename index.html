<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TIDY">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>TIDY</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel-2:#1e222b; --border:#2a2f3a;
    --text:#e6e9ef; --muted:#9aa4b2; --faint:#6b7482; --accent:#6ea8fe;
    --good:#3fb950; --gap:#e0a138; --gap-bg:rgba(224,161,56,.12);
    --danger:#f0616d; --danger-bg:rgba(240,97,109,.12);
    --summer:#ffcf5c; --summer-bg:rgba(255,207,92,.10); --radius:14px;
    --c-WHITE:#f5f6f8; --c-GRAY:#9aa0a6; --c-BLACK:#20242c; --c-RED:#c0392b;
    --c-ORANGE:#e67e22; --c-YELLOW:#f1c40f; --c-GREEN:#27ae60; --c-TEAL:#17a2b8;
    --c-BLUE:#2e86de; --c-NAVY:#2c3e66; --c-PURPLE:#8e44ad; --c-PINK:#e84393;
    --c-BROWN:#8d6e63; --c-BEIGE:#d9c7a8; --c-KHAKI:#7a7a52;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--bg);color:var(--text);line-height:1.5;
    padding:0 0 calc(64px + env(safe-area-inset-bottom));font-size:15px}
  .app{max-width:520px;margin:0 auto;min-height:100vh}
  .top{position:sticky;top:0;z-index:5;background:rgba(15,17,21,.9);backdrop-filter:blur(8px);
    padding:14px 16px calc(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
  .top .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#6ea8fe,#8e7bff);display:grid;place-items:center;font-weight:800;color:#0f1115;font-size:15px}
  .top h1{font-size:16px;font-weight:800}
  .top .season{margin-left:auto;font-size:11px;color:var(--summer);background:var(--summer-bg);border:1px solid rgba(255,207,92,.3);padding:3px 9px;border-radius:99px;font-weight:700}
  .view{padding:14px 16px;display:none}
  .view.on{display:block}
  h2.sec{font-size:14px;color:var(--muted);margin:4px 0 10px;display:flex;align-items:center;gap:8px}

  /* progress */
  .prog{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
  .prog .lab{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}
  .prog .lab b{font-size:18px}
  .bar{height:9px;border-radius:99px;background:var(--panel-2);overflow:hidden}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,#6ea8fe,#8e7bff);border-radius:99px;transition:width .3s}

  .grp{margin-bottom:16px}
  .ghead{display:flex;align-items:center;gap:8px;margin:0 2px 8px}
  .ghead .nm{font-size:14px;font-weight:700}
  .ghead .brk{color:var(--faint);font-size:12px}
  .ghead .cnt{margin-left:auto;font-size:11px;font-weight:800;color:var(--gap)}

  .row{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);
    border-radius:12px;padding:11px 12px;margin-bottom:7px;cursor:pointer;transition:.12s}
  .row:active{transform:scale(.99)}
  .row.done{opacity:.5}
  .row.done .type,.row.done .cname{text-decoration:line-through}
  .chip{width:22px;height:22px;border-radius:6px;border:1px solid rgba(255,255,255,.18);flex:none}
  .chip.accent{border-radius:50%}
  .cname{font-weight:700;font-size:13px;width:56px;flex:none}
  .type{flex:1;font-size:13px}
  .type small{color:var(--faint);display:block;font-size:11px}
  .q{font-weight:800;font-size:15px;color:var(--gap);min-width:34px;text-align:right}
  .check{width:24px;height:24px;border-radius:7px;border:2px solid var(--border);flex:none;display:grid;place-items:center;font-size:14px;color:transparent}
  .row.done .check{background:var(--good);border-color:var(--good);color:#0f1115}
  .row.done .q{color:var(--faint)}

  /* dashboard */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:11px 12px;text-align:center}
  .stat .k{color:var(--faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.3px}
  .stat .v{font-size:20px;font-weight:800;margin-top:3px}
  .stat.gap .v{color:var(--gap)} .stat.have .v{color:var(--good)}
  .mcard{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;margin-bottom:10px;cursor:pointer}
  .mcard:active{border-color:var(--accent)}
  .mcard .h{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .mcard .h .nm{font-weight:700;font-size:14px}
  .mcard .h .tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;background:rgba(110,168,254,.14);color:#9cc2ff}
  .mcard .h .tg{margin-left:auto;font-size:11px;font-weight:800}
  .mcard .h .tg.gap{color:var(--gap)} .mcard .h .tg.full{color:var(--good)}
  .mbar{height:7px;border-radius:99px;background:var(--panel-2);overflow:hidden}
  .mbar>i{display:block;height:100%;background:linear-gradient(90deg,#6ea8fe,#8e7bff)}
  .mcard .pal{display:flex;gap:4px;margin-top:9px}
  .dot{width:15px;height:15px;border-radius:4px;border:1px solid rgba(255,255,255,.14)}

  /* detail */
  .back{color:var(--accent);font-size:13px;font-weight:700;background:none;border:none;padding:0;margin-bottom:10px;cursor:pointer}
  .drow{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:11px 13px;margin-bottom:8px}
  .drow .rn{font-weight:700;font-size:13px;margin-bottom:8px}
  .cells{display:flex;gap:6px;flex-wrap:wrap}
  .cell{flex:1;min-width:60px;text-align:center;background:var(--panel-2);border:1px solid var(--border);border-radius:9px;padding:7px 4px}
  .cell .cs{font-size:10px;color:var(--faint)}
  .cell .cv{font-weight:800;font-size:14px;margin-top:2px}
  .cell.full .cv{color:var(--good)} .cell.gap .cv{color:var(--gap)}
  .cell.summer{background:var(--summer-bg)}

  /* global */
  .grow{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:11px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;font-size:13px}
  .grow.warn{border-color:rgba(240,97,109,.3)}
  .pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
  .pill.mod{background:rgba(110,168,254,.12);color:#9cc2ff}
  .pill.warn{background:var(--danger-bg);color:var(--danger)}
  .pill.gap{background:var(--gap-bg);color:var(--gap)}
  .muted{color:var(--faint)}
  .resetbtn{width:100%;margin-top:8px;padding:10px;border:1px solid var(--border);background:var(--panel);color:var(--muted);border-radius:10px;font-size:13px;cursor:pointer}

  /* bottom nav */
  nav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;background:rgba(23,26,33,.96);
    backdrop-filter:blur(10px);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;background:none;border:none;color:var(--faint);padding:9px 0 8px;font-size:11px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
  nav button .ic{font-size:19px;line-height:1}
  nav button.on{color:var(--accent)}
  .empty{color:var(--faint);font-size:13px;padding:10px 2px}
  .addbox{display:flex;gap:8px;margin-bottom:14px}
  .tinput{flex:1;background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:11px 13px;color:var(--text);font-size:14px}
  .tinput:focus{outline:none;border-color:var(--accent)}
  .addbtn{background:var(--accent);color:#0f1115;border:none;border-radius:10px;padding:0 16px;font-weight:800;font-size:14px;cursor:pointer}
  .ibrow{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:11px 12px;margin-bottom:8px}
  .ibrow .nm{font-weight:700;font-size:14px}
  .ibchips{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
  .ibacts{display:flex;gap:6px;margin-top:9px}
  .ibbtn{flex:1;border:1px solid var(--border);background:var(--panel-2);color:var(--text);border-radius:9px;padding:8px 0;font-size:12px;font-weight:700;cursor:pointer}
  .ibbtn.ok{background:rgba(63,185,80,.16);color:#7ee787;border-color:transparent}
  .ibbtn.del{background:var(--danger-bg);color:var(--danger);border-color:transparent}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo">T</div>
    <h1 id="title">TIDY</h1>
    <span class="season">☀ 여름</span>
  </div>

  <div class="view on" id="v-shop"></div>
  <div class="view" id="v-dash"></div>
  <div class="view" id="v-detail"></div>
  <div class="view" id="v-inbox"></div>
  <div class="view" id="v-global"></div>
</div>

<nav>

  <button data-v="dash"><span class="ic">📊</span>옷장</button>
  <button data-v="inbox"><span class="ic">📥</span>인박스</button>

    {id:'r2',color:'BLACK',cname:'블랙',type:'접이 우산',note:'가방 상비',q:1,module:null,role:null,bk:null},
    {id:'r3',color:'BLACK',cname:'블랙',type:'레인부츠/방수 신발',note:'일상 우천',q:1,module:null,role:null,bk:null},
  ]},
];
const ALLBUY=BUY.flatMap(g=>g.items);
const buyTotal=ALLBUY.reduce((s,it)=>s+it.q,0);

// ═══ 상태 (localStorage) ═══
const KEY='tidy_bought_v1';
let bought=new Set(JSON.parse(localStorage.getItem(KEY)||'[]'));
const save=()=>localStorage.setItem(KEY,JSON.stringify([...bought]));
// 인박스(미배정 검토함) + 배정 완료(옷장 편입)
let inbox=JSON.parse(localStorage.getItem('tidy_inbox_v1')||'[]');
let added=JSON.parse(localStorage.getItem('tidy_added_v1')||'[]');
const saveInbox=()=>localStorage.setItem('tidy_inbox_v1',JSON.stringify(inbox));
const saveAdded=()=>localStorage.setItem('tidy_added_v1',JSON.stringify(added));
let seq=Date.now();

// ═══ 백업 · 복원 (localStorage → JSON 파일) ═══
function exportData(){
  const payload={version:1,exportedAt:new Date().toISOString(),bought:[...bought],inbox,added};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`tidy-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function importData(file){
  const reader=new FileReader();
  reader.onload=()=>{
    let data;
    try{ data=JSON.parse(reader.result); }
    catch(e){ alert('올바른 백업 파일이 아닙니다 (JSON 파싱 실패).'); return; }
    if(!data||typeof data!=='object'||!Array.isArray(data.added)||!Array.isArray(data.inbox)||!Array.isArray(data.bought)){
      alert('올바른 TIDY 백업 파일이 아닙니다.'); return;
    }
    if(!confirm('현재 기기의 데이터(구매 체크·인박스·배정 옷장)를 이 백업 파일 내용으로 덮어쓸까요?')) return;
    bought=new Set(data.bought);
    inbox=data.inbox;
    added=data.added;
    save(); saveInbox(); saveAdded();
    renderShop(); renderDash(); renderInbox(); renderGlobal();
    alert('복원 완료');
  };
  reader.readAsText(file);
}

// ── 자동 추론 (이름 키워드 → 모듈·역할·계절) ──
const MOD_KW={회사:'UNIFORM',유니폼:'UNIFORM',근무:'UNIFORM',등산:'HIKING',트레킹:'HIKING',아웃도어:'HIKING',헬스:'WORKOUT',러닝:'WORKOUT',운동:'WORKOUT',짐:'WORKOUT',정장:'SUIT',수트:'SUIT',예복:'SUIT',드레스셔츠:'SUIT',주말:'WEEKEND',데이트:'WEEKEND',캐주얼:'WEEKEND',잠옷:'HOMEWEAR',실내:'HOMEWEAR',홈웨어:'HOMEWEAR',속옷:'INNER',내복:'INNER',양말:'INNER'};
const ROLE_KW={셔츠:'TOP',티:'TOP',반팔:'TOP',니트:'TOP',맨투맨:'TOP',후드:'TOP',폴로:'TOP',바지:'BOTTOM',팬츠:'BOTTOM',청바지:'BOTTOM',슬랙스:'BOTTOM',반바지:'BOTTOM',쇼츠:'BOTTOM',치노:'BOTTOM',조거:'BOTTOM',자켓:'OUTER',코트:'OUTER',패딩:'OUTER',가디건:'OUTER',셸:'OUTER',바람막이:'OUTER',운동화:'SHOES',구두:'SHOES',스니커즈:'SHOES',부츠:'SHOES',신발:'SHOES',로퍼:'SHOES',슬리퍼:'SHOES'};
const SEASON_KW=[[/(린넨|반팔|반바지|메시|쿨)/,'SUMMER'],[/(기모|패딩|울|두꺼|플리스|다운)/,'WINTER'],[/(가디건|트렌치|얇은|간절기)/,'SHOULDER']];
const matchKW=(name,dict)=>{for(const k in dict)if(name.includes(k))return dict[k];return null;};
function inferItem(name){
  let season='ALL_SEASON'; for(const [re,s] of SEASON_KW)if(re.test(name)){season=s;break;}
  return {module:matchKW(name,MOD_KW)||null, role:matchKW(name,ROLE_KW)||'TOP', season};
}

// ═══ 카운팅 ═══
function normRole(g){
  if(g.module==='INNER'){if(g.role==='INNER')return'UNDERWEAR';if(g.role==='ACCESSORY')return'SOCKS';}
  if(g.module==='SUIT'){if(g.role==='OUTER'||g.role==='BOTTOM')return'SUITSET';if(g.role==='TOP')return'DRESS_SHIRT';}
  return g.role;
}
const qtyOf=g=>g.qty||1;
// 실효 보유 = 기존 보유(active) + 구매완료 + 인박스에서 배정 완료
function effInv(){
  const base=INV.filter(g=>g.active!==false);
  const boughtG=ALLBUY.filter(it=>bought.has(it.id)&&it.role).map(it=>({
    module:it.module,role:it.role,season:it.bk==='summer'?'SUMMER':'ALL_SEASON',color:it.color,cond:'NEW',qty:it.q,_buy:1}));
  return base.concat(boughtG, added.filter(g=>g.module&&g.module!=='INBOX'));
}
function ownedCells(module,role,inv){
  const buckets=(DATA[module]?.t[role])||{};
  const items=inv.filter(g=>g.module===module&&normRole(g)===role);
  const byB={}; items.forEach(g=>{(byB[bucket(g.season)]??=[]).push(g);});
  const cnt=b=>(byB[b]||[]).reduce((s,g)=>s+qtyOf(g),0);
  const cell={};
  Object.keys(buckets).forEach(b=>{if(b!=='allseason')cell[b]=cnt(b);});
  const asC=cnt('allseason'),asN=buckets['allseason']||0;
  if(buckets['allseason']!=null)cell['allseason']=Math.min(asC,asN);
  let flex=Math.max(0,asC-asN);
  ['summer','winter','shoulder'].forEach(b=>{if(buckets[b]==null)return;const gap=buckets[b]-(cell[b]||0);if(gap>0&&flex>0){const u=Math.min(gap,flex);cell[b]=(cell[b]||0)+u;flex-=u;}});
  return cell;
}
function moduleStat(module,inv){
  let T=0,O=0; const t=DATA[module].t;
  for(const role of Object.keys(t)){const c=ownedCells(module,role,inv);for(const [b,need] of Object.entries(t[role])){T+=need;O+=Math.min(c[b]||0,need);}}
  return {T,O,gap:T-O};
}

// ═══ 렌더 ═══
const $=id=>document.getElementById(id);
const dot=(c,acc)=>`<span class="chip ${acc?'accent':''}" style="background:var(--c-${c})"></span>`;

function renderShop(){
  const done=[...bought].filter(id=>ALLBUY.find(x=>x.id===id)).length;
  const doneQty=ALLBUY.filter(it=>bought.has(it.id)).reduce((s,it)=>s+it.q,0);
  let h=`<div class="prog"><div class="lab"><span>구매 진행</span><span><b>${doneQty}</b> / ${buyTotal}~${buyTotal+3}점</span></div>
    <div class="bar"><i style="width:${Math.round(doneQty/(buyTotal+3)*100)}%"></i></div></div>`;
  BUY.forEach(grp=>{
    const gd=grp.items.every(it=>bought.has(it.id));
    h+=`<div class="grp"><div class="ghead"><span class="nm">${grp.g}</span><span class="brk">· ${grp.brk}</span><span class="cnt">${gd?'✓ 완료':''}</span></div>`;
    grp.items.forEach(it=>{
      const on=bought.has(it.id);
      h+=`<div class="row ${on?'done':''}" data-buy="${it.id}">
        ${dot(it.color,it.acc)}<span class="cname">${it.cname}</span>
        <span class="type">${it.type}${it.note?`<small>${it.note}</small>`:''}</span>
        <span class="q">×${it.q}</span>
        <span class="check">✓</span></div>`;
    });
    h+=`</div>`;
  });
  $('v-shop').innerHTML=h;
  $('v-shop').querySelectorAll('[data-buy]').forEach(el=>el.onclick=()=>{
    const id=el.dataset.buy; bought.has(id)?bought.delete(id):bought.add(id); save(); renderShop();
  });
}

function renderDash(){
  const inv=effInv();
  let T=0,O=0;
  const cards=Object.keys(DATA).map(id=>{
    const s=moduleStat(id,inv); T+=s.T; O+=s.O;
    const pct=Math.round(s.O/s.T*100);
    const m=DATA[id];
    return `<div class="mcard" data-mod="${id}">
      <div class="h"><span class="nm">${m.name}</span><span class="tag">격식 ${m.formality}</span>
        <span class="tg ${s.gap>0?'gap':'full'}">${s.gap>0?'부족 '+s.gap:'충족'}</span></div>
      <div class="mbar"><i style="width:${Math.max(3,pct)}%"></i></div>
      <div class="pal">${m.pal.base.map(c=>dot(c)).join('')}</div>
    </div>`;
  }).join('');
  $('v-dash').innerHTML=`
    <div class="stats">
      <div class="stat"><div class="k">목표</div><div class="v">${T}</div></div>
      <div class="stat have"><div class="k">보유</div><div class="v">${O}</div></div>
      <div class="stat gap"><div class="k">부족</div><div class="v">${T-O}</div></div>
    </div>
    <h2 class="sec">모듈 (탭하면 상세)</h2>${cards}`;
  $('v-dash').querySelectorAll('[data-mod]').forEach(el=>el.onclick=()=>openDetail(el.dataset.mod));
}

function openDetail(mid){
  const inv=effInv(), m=DATA[mid], s=moduleStat(mid,inv);
  let rows='';
  for(const role of Object.keys(m.t)){
    const c=ownedCells(mid,role,inv);
    const cells=SEASONS.filter(([b])=>m.t[role][b]!=null).map(([b,kb])=>{
      const need=m.t[role][b],o=Math.min(c[b]||0,need);
      const cls=o>=need?'full':'gap';
      return `<div class="cell ${cls} ${b==='summer'?'summer':''}"><div class="cs">${kb}</div><div class="cv">${o}/${need}</div></div>`;
    }).join('');
    rows+=`<div class="drow"><div class="rn">${ROLE_KO[role]||role}</div><div class="cells">${cells}</div></div>`;
  }
  $('v-detail').innerHTML=`<button class="back" onclick="setView('dash')">← 옷장</button>
    <h2 class="sec">${m.name} · 격식 ${m.formality} · <span class="${s.gap>0?'':''}">보유 ${s.O}/${s.T}</span></h2>
    <div class="pal" style="margin-bottom:12px">${m.pal.base.map(c=>dot(c)).concat(m.pal.accent.map(c=>dot(c,1))).join('')}</div>
    ${rows}`;
  setView('detail');
}

function renderGlobal(){
  const inv=effInv();
  // 중복
  const byRC={}; inv.forEach(g=>{const k=`${normRole(g)}|${g.color}`;(byRC[k]??=[]).push(g);});
  const dup=Object.entries(byRC).map(([k,gs])=>({k,mods:[...new Set(gs.map(g=>g.module))]})).filter(x=>x.mods.length>=2);
  const dupH=dup.length?dup.map(d=>{const[r,c]=d.k.split('|');
    return `<div class="grow warn">${dot(c)}<div style="flex:1"><b>${ROLE_KO[r]||r}·${KO[c]}</b></div>${d.mods.map(m=>`<span class="pill mod">${MODNAME[m]}</span>`).join('')}<span class="pill warn">중복</span></div>`;}).join(''):'<div class="empty">중복 없음</div>';
  // 처분
  const retire=INV.filter(g=>g.cond==='RETIRE');
  const retH=retire.length?retire.map(g=>`<div class="grow">${dot(g.color)}<div style="flex:1"><b>${g.name}</b> <span class="muted">${MODNAME[g.module]}</span></div><span class="pill gap">처분</span></div>`).join(''):'<div class="empty">없음</div>';
  // ☔ 비 대비 커버리지 (날씨 축) — 활동 모듈별 방수 아이템 유무
  const actMods=Object.keys(DATA).filter(id=>id!=='INNER');
  const rainH=actMods.map(id=>{
    const rainy=inv.filter(g=>g.module===id&&(g.weather||[]).includes('RAIN'));
    const ok=rainy.length>0;
    return `<div class="grow ${ok?'':'warn'}"><span style="font-size:15px;flex:none">${ok?'✓':'☔'}</span>
      <div style="flex:1"><b>${MODNAME[id]}</b> <span class="muted">${ok?rainy.map(g=>g.name).join(', '):'방수 아이템 없음'}</span></div>
      <span class="pill ${ok?'mod':'warn'}">${ok?'대비':'공용 우산 필요'}</span></div>`;
  }).join('');
  $('v-global').innerHTML=`
    <h2 class="sec">⚠ 중복 경보 <span class="muted" style="font-weight:400">(같은 역할·색이 여러 모듈)</span></h2>${dupH}
    <h2 class="sec" style="margin-top:16px">☔ 비 대비 커버리지 <span class="muted" style="font-weight:400">(방수 아이템 보유 모듈)</span></h2>${rainH}
    <div class="empty" style="padding-top:4px">방수 없는 모듈은 공용 우천 장비(우산·레인부츠)로 커버 — 신발처럼 모듈 교차 공용</div>
    <h2 class="sec" style="margin-top:16px">🗑 처분 대상</h2>${retH}
    <h2 class="sec" style="margin-top:16px">🔁 빌림 · 💤 데드스톡</h2>
    <div class="empty">착용 로그 누적 후 표시 (앱에서 착용 기록 시작하면 활성화)</div>
    <h2 class="sec" style="margin-top:16px">💾 백업 · 복원 <span class="muted" style="font-weight:400">(이 기기의 데이터만 저장됨)</span></h2>
    <div class="empty" style="padding-top:0 0 8px">구매 체크·인박스·배정한 옷장은 이 브라우저에만 저장돼요. 기기를 바꾸거나 저장공간이 지워지면 사라지니, 가끔 백업해두는 걸 권장합니다.</div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="resetbtn" id="exportBtn" style="flex:1">⬇ 백업 파일 내보내기</button>
      <button class="resetbtn" id="importBtn" style="flex:1">⬆ 백업 파일 불러오기</button>
    </div>
    <input type="file" id="importFile" accept="application/json" style="display:none">
    <button class="resetbtn" style="margin-top:8px" onclick="if(confirm('구매 체크를 모두 초기화할까요?')){bought.clear();save();renderShop();renderDash();renderGlobal();}">구매 체크 초기화</button>`;
  $('exportBtn').onclick=exportData;
  $('importBtn').onclick=()=>$('importFile').click();
  $('importFile').onchange=e=>{ if(e.target.files[0]) importData(e.target.files[0]); e.target.value=''; };
}

// ═══ 인박스 (미배정 검토) ═══
const SEASON_KO2={SUMMER:'여름',WINTER:'겨울',SHOULDER:'간절기',ALL_SEASON:'사철'};
const CYCLE=['UNIFORM','WEEKEND','WORKOUT','HIKING','SUIT','HOMEWEAR','INNER',null];
function renderInbox(){
  const assignedN=added.filter(g=>g.module&&g.module!=='INBOX').length;
  let h=`<div class="prog"><div class="lab"><span>인박스 검토</span><span>대기 <b>${inbox.length}</b> · 배정 <b>${assignedN}</b></span></div>
    <div class="bar"><i style="width:${inbox.length+assignedN?Math.round(assignedN/(inbox.length+assignedN)*100):0}%"></i></div></div>
    <div class="addbox"><input id="inboxName" class="tinput" placeholder="집에 있는 옷 이름 (예: 네이비 반팔티)"><button class="addbtn" id="addBtn">추가</button></div>
    <div class="empty" style="padding:0 2px 10px">이름 넣으면 모듈·역할·계절을 자동 제안 → 맞으면 <b style="color:#7ee787">배정</b>, 아니면 <b style="color:var(--danger)">처분</b>. ↻로 모듈 변경.</div>`;
  if(!inbox.length) h+=`<div class="empty">인박스가 비어 있어요.</div>`;
  inbox.forEach(it=>{
    const modName=it.module?MODNAME[it.module]:'미정';
    h+=`<div class="ibrow">
      <div class="nm">${it.name}</div>
      <div class="ibchips"><span class="pill ${it.module?'mod':'warn'}">${modName}</span>
        <span class="pill">${ROLE_KO[it.role]||it.role}</span>
        <span class="pill">${SEASON_KO2[it.season]||'사철'}</span></div>
      <div class="ibacts">
        <button class="ibbtn cyc" data-id="${it.id}">↻ 모듈</button>
        <button class="ibbtn ok" data-id="${it.id}">배정</button>
        <button class="ibbtn del" data-id="${it.id}">처분</button>
      </div></div>`;
  });
  if(added.length){
    h+=`<h2 class="sec" style="margin-top:18px">✅ 배정 완료 <span class="muted" style="font-weight:400">· 옷장 집계에 반영됨 · ${added.length}개</span></h2>`;
    added.forEach(it=>{
      h+=`<div class="ibrow">
        <div class="nm">${it.name}</div>
        <div class="ibchips"><span class="pill mod">${MODNAME[it.module]||it.module}</span>
          <span class="pill">${ROLE_KO[it.role]||it.role}</span>
          <span class="pill">${SEASON_KO2[it.season]||'사철'}</span></div>
        <div class="ibacts"><button class="ibbtn del" data-added="${it.id}">삭제</button></div>
      </div>`;
    });
  }
  $('v-inbox').innerHTML=h;
  const inp=$('inboxName');
  $('addBtn').onclick=()=>{const n=inp.value.trim();if(!n)return;const inf=inferItem(n);inbox.push({id:'ib'+(++seq),name:n,...inf});saveInbox();renderInbox();};
  inp.onkeydown=e=>{if(e.key==='Enter')$('addBtn').click();};
  $('v-inbox').querySelectorAll('.cyc').forEach(b=>b.onclick=()=>{const it=inbox.find(x=>x.id===b.dataset.id);const i=CYCLE.indexOf(it.module);it.module=CYCLE[(i+1)%CYCLE.length];saveInbox();renderInbox();});
  $('v-inbox').querySelectorAll('.ok').forEach(b=>b.onclick=()=>{const it=inbox.find(x=>x.id===b.dataset.id);if(!it.module){alert('먼저 ↻로 모듈을 지정하세요');return;}added.push({...it,color:'GRAY',cond:'GOOD'});inbox=inbox.filter(x=>x.id!==it.id);saveInbox();saveAdded();renderInbox();renderDash();});
  $('v-inbox').querySelectorAll('.del').forEach(b=>b.onclick=()=>{inbox=inbox.filter(x=>x.id!==b.dataset.id);saveInbox();renderInbox();});
  $('v-inbox').querySelectorAll('[data-added]').forEach(b=>b.onclick=()=>{
    if(!confirm('옷장에서 이 항목을 삭제할까요? (되돌릴 수 없음)'))return;
    added=added.filter(x=>x.id!==b.dataset.added); saveAdded(); renderInbox(); renderDash();
  });
}

// ═══ 네비 ═══
function setView(v){
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));
  $('v-'+v).classList.add('on');
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  const titles={shop:'🛒 여름 구매 리스트',dash:'📊 내 옷장',detail:'옷장 상세',inbox:'📥 인박스 · 미배정 검토',global:'🌐 정리·전역'};
  $('title').textContent=titles[v]||'TIDY';
  window.scrollTo(0,0);
}
window.setView=setView;
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{const v=b.dataset.v;if(v==='dash')renderDash();if(v==='global')renderGlobal();if(v==='inbox')renderInbox();setView(v);});

// init
renderShop(); renderDash(); renderInbox(); renderGlobal();

// PWA: 오프라인·홈화면 설치 (호스팅(https) 환경에서만 활성)
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
